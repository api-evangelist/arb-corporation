name: ARB 4x4 Outlet UCP MCP server
description: Universal Commerce Protocol (UCP) MCP server for ARB Corporation's ARB 4x4 OUTLET online store (4x4outlet.arb.com.au),
  a Shopify storefront. It is the Shopify platform's standard storefront UCP server (serverInfo universal-commerce 0.1.0),
  not a server built by ARB itself. It is advertised by the store's own llms.txt, agents.md, robots.txt and /.well-known/ucp
  profile.
server:
  name: universal-commerce
  version: 0.1.0
  protocolVersion: '2025-06-18'
  transport: streamable-http (JSON response)
  platform: Shopify
discovery:
- url: https://4x4outlet.arb.com.au/llms.txt
  status: 200
- url: https://4x4outlet.arb.com.au/agents.md
  status: 200
- url: https://4x4outlet.arb.com.au/robots.txt
  status: 200
  note: 'advertises "UCP/MCP endpoint: https://4x4outlet.arb.com.au/api/ucp/mcp"'
- url: https://4x4outlet.arb.com.au/.well-known/ucp
  status: 200
  note: UCP profile version 2026-08-25; lists the MCP service endpoint on the store's myshopify host https://d2fb05-36.myshopify.com/api/ucp/mcp
    with schema https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
- url: https://4x4outlet.arb.com.au/api/mcp
  status: 404
  note: not the endpoint; checked with GET only
probe:
  initialize:
    status: 200
  tools_list:
    status: 200
    tool_count: 13
  auth_required_for_tools_list: false
  note: Only initialize and tools/list were called, against the endpoint the provider advertises. No tool was invoked.
auth:
  type: none
  note: initialize and tools/list answered without credentials. The llms.txt says agents must identify themselves with Web
