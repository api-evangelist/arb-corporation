deployment:
  mode: remote
  endpoint: https://4x4outlet.arb.com.au/api/ucp/mcp
  auth: none
  verified: probed
notes: The scope is the 4x4 Outlet store, not the main arb.com.au site, which publishes no API or llms.txt (https://www.arb.com.au/llms.txt
  returned 404). There is no OpenAPI in this repo, so there is no tool crosswalk, overlay or skill. The provider points agents
  to the Shop skill at https://shop.app/SKILL.md, which is published by Shopify for every Shopify store, not by ARB.
